name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: frontend
      - run: npx oxlint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  integration:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start DB only
        run: docker compose up -d db --wait --wait-timeout 60
      - name: Run migration
        run: docker compose run --rm -e DB_HOST=db -e DB_PORT=5432 backend node db/migrate.js
      - name: Build & start full compose
        run: |
          docker compose up -d --wait --wait-timeout 120
          sleep 15
      - name: Smoke test API (frontend :5174 nginx -> backend)
        run: |
          echo "--- /api/clinics ---"
          curl -fsS http://localhost:5174/api/clinics
          echo
          echo "--- login admin ---"
          curl -fsS -X POST http://localhost:5174/api/auth/login \
            -H 'content-type:application/json' \
            -d '{"email":"admin@health.id","password":"admin123"}'
          echo
          echo "--- public current ---"
          curl -fsS http://localhost:5174/api/queue/current
          echo
      - name: Tear down
        if: always()
        run: docker compose down -v
